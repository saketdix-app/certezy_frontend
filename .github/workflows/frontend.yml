name: Build and Push Frontend

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1b — Lint + build gate (fails fast before pushing an image)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install & build
        run: |
          npm ci --ignore-scripts
          npm run build

      # Step 2 — Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3 — Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4 — Build and push image to DockerHub
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: |
            pawandangi2001/certezy_frontend:latest
            pawandangi2001/certezy_frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_APP_URL=${{ vars.VITE_APP_URL }}
            VITE_RAZORPAY_KEY_ID=${{ vars.VITE_RAZORPAY_KEY_ID }}
            VITE_PAYPAL_MODE=${{ vars.VITE_PAYPAL_MODE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max